<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#141414">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Oblecto</title>
    <style>
      * {
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
        box-sizing: border-box;
      }

      /* The app's own dark background, before its stylesheet arrives, so a load
         never flashes white; and dark form controls and autofill throughout. */
      html {
        color-scheme: dark;
        background: #141414;
      }

      html, body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
